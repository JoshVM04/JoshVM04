# Genera la serpiente de aportes (tonos azules) y la publica en la rama "output".
name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # todos los días, 00:00 hora de Costa Rica
  workflow_dispatch: # permite ejecutarla a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0A2540&color_dots=#ebedf0,#bfd6f6,#8dbdff,#3c7dd9,#1f4e8c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#79B8FF&color_dots=#161b22,#0d2a4f,#1f4e8c,#3b78c4,#79b8ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
